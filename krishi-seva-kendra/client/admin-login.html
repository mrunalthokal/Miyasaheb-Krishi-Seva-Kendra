<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin login — MiyasahebKrishi Seva Kendra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body style="background: var(--leaf-900);">

<div class="auth-wrap" style="min-height:100vh;">
  <div class="auth-card">
    <div class="card">
      <div class="auth-head">
        <span class="brand-mark" style="margin: 0 auto 12px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 21V10L12 4L20 10V21H14V15H10V21H4Z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg></span>
        <h2>Admin login</h2>
        <p class="mb-0">Manage products, requests and content for Krishi Seva Kendra.</p>
      </div>
      <div id="form-alert"></div>
      <form id="admin-login-form" novalidate>
        <div class="field">
          <label for="mobile">Mobile number</label>
          <input type="tel" id="mobile" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Log in</button>
      </form>
      <p class="text-center" style="margin-top:1.2rem; font-size:0.85rem;"><a href="index.html">← Back to site</a></p>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin-login.js"></script>
</body>
</html>
