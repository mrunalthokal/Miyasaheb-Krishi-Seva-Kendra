<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Products — Miyasaheb Krishi Seva Kendra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="site-header"></div>

<section class="section container">
  <div class="section-head">
    <div>
      <h2 class="mt-0">Products</h2>
      <p class="mb-0">Search and filter the center's current stock.</p>
    </div>
  </div>

  <div class="card-flat" style="margin-bottom:1.6rem;">
    <div class="form-row" style="margin-bottom:1rem;">
      <div class="field mb-0">
        <label for="search-input">Search</label>
        <input type="text" id="search-input" placeholder="Search seeds, fertilizers, tools…" />
      </div>
      <div class="field mb-0">
        <label for="availability-select">Availability</label>
        <select id="availability-select">
          <option value="">All</option>
          <option value="Available">Available</option>
          <option value="Out of Stock">Out of stock</option>
        </select>
      </div>
    </div>
    <div class="chip-row" id="category-chips">
      <button class="chip active" data-cat="">All categories</button>
    </div>
  </div>

  <div id="results-count" class="text-muted" style="margin-bottom:1rem; font-size:0.88rem;"></div>
  <div class="grid-4" id="product-grid">
    <div class="product-card skeleton" style="height:260px;"></div>
    <div class="product-card skeleton" style="height:260px;"></div>
    <div class="product-card skeleton" style="height:260px;"></div>
    <div class="product-card skeleton" style="height:260px;"></div>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/products.js"></script>
</body>
</html>
