<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — Miyasaheb Krishi Seva Kendra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="site-header"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="card">
      <div class="auth-head">
        <h2>Welcome back</h2>
        <p class="mb-0">Log in to request supplies and track your orders.</p>
      </div>
      <div id="form-alert"></div>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="mobile">Mobile number</label>
          <input type="tel" id="mobile" placeholder="9876543210" maxlength="10" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Your password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Log in</button>
      </form>
      <p class="text-center" style="margin-top:1.2rem; font-size:0.9rem;">New here? <a href="register.html">Create an account</a></p>
    </div>
  </div>
</div>

<div id="site-footer"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/login.js"></script>
</body>
</html>
