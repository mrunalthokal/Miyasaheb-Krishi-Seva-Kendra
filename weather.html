<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Weather — Miyasaheb Krishi Seva Kendra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="site-header"></div>

<section class="section container-narrow">
  <h2 class="mt-0">Weather</h2>
  <p style="margin-bottom:1.6rem;">Check current conditions and a short outlook before you plan work in the field.</p>

  <form id="district-form" class="flex-gap" style="margin-bottom:1.8rem;">
    <input type="text" id="district-input" placeholder="Enter district name" style="flex:1; padding:11px 14px; border:1.5px solid var(--line-strong); border-radius:8px;" />
    <button type="submit" class="btn btn-primary">Check</button>
  </form>

  <div id="weather-result">
    <div class="card skeleton" style="height:220px;"></div>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/weather.js"></script>
</body>
</html>
