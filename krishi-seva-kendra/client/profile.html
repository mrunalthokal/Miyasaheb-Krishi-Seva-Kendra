<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My profile — Miyasaheb Krishi Seva Kendra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="site-header"></div>

<section class="section container">
  <div class="dash-layout">
    <aside class="dash-side">
      <span class="dash-side-heading">My account</span>
      <a href="dashboard.html">Dashboard</a>
      <a href="profile.html" class="active">My profile</a>
      <a href="my-inquiries.html">My requests</a>
      <span class="dash-side-heading">Explore</span>
      <a href="products.html">Products</a>
      <a href="schemes.html">Schemes</a>
      <a href="crop-tips.html">Crop tips</a>
    </aside>

    <div style="max-width: 560px;">
      <h2 class="mt-0">My profile</h2>
      <p style="margin-bottom:1.6rem;">Keep your details current so the center can reach you about your requests.</p>

      <div class="card">
        <div id="form-alert"></div>
        <form id="profile-form" novalidate>
          <div class="field">
            <label for="name">Full name</label>
            <input type="text" id="name" required />
          </div>
          <div class="field">
            <label for="mobile">Mobile number</label>
            <input type="tel" id="mobile" disabled />
            <div class="field-hint">Mobile number cannot be changed. Contact the center if it's incorrect.</div>
          </div>
          <div class="form-row">
            <div class="field">
              <label for="village">Village</label>
              <input type="text" id="village" />
            </div>
            <div class="field">
              <label for="landSize">Land size (acres)</label>
              <input type="number" id="landSize" min="0" step="0.1" />
            </div>
          </div>
          <div class="field">
            <label for="address">Address</label>
            <textarea id="address" rows="2"></textarea>
          </div>
          <button type="submit" class="btn btn-primary" id="submit-btn">Save changes</button>
        </form>
      </div>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
