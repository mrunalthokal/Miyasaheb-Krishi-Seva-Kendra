<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Crop tips — Krishi Seva Kendra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="site-header"></div>

<section class="section container">
  <h2 class="mt-0">Seasonal crop tips</h2>
  <p style="max-width:60ch; margin-bottom:1.4rem;">Sowing windows, irrigation timing and care notes shared by the center's agronomists.</p>

  <div class="chip-row" id="season-filter" style="margin-bottom:1.8rem;">
    <button class="chip active" data-season="">All seasons</button>
    <button class="chip" data-season="Kharif">Kharif</button>
    <button class="chip" data-season="Rabi">Rabi</button>
    <button class="chip" data-season="Zaid">Zaid</button>
  </div>

  <div id="tips-list" class="grid-2">
    <div class="card skeleton" style="height:150px;"></div>
    <div class="card skeleton" style="height:150px;"></div>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/crop-tips.js"></script>
</body>
</html>
